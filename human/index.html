<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lando Click</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <h1>🏎️ LANDO CLICK</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#play">Play</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <!-- ABOUT SECTION -->
        <section id="about">
            <h2>About the Game</h2>
            <p>Click on Lando Norris's logo to cheer for him!</p>
        </section>

        <!-- PLAY SECTION -->
        <section id="play">
            <h2>How to Play</h2>
            <p>Click the logo and watch your score increase.</p>
            <a href="https://academy.cs.cmu.edu/exercise/2980/" target="_blank" class="btn">Play Now</a>
        </section>

        <!-- CONTACT SECTION -->
        <section id="contact">
            <h2>Contact</h2>
            <p>Send us your feedback!</p>
            <form>
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="Your Message" required></textarea>
                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2024 Lando Click - F1 Fan Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
